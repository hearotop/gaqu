[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaqu"
version = "0.1.0"
description = "GNOME application quick update"
requires-python = ">=3.10"
license = {text = "GPL-2.0-or-later"}
authors = [{name = "GAQU contributors"}]

[project.scripts]
gaqu = "gaqu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaqu = [
    "systemd/*.service",
    "systemd/*.timer",
    "gnome-extension/*.js",
    "gnome-extension/*.json",
    "gnome-extension/po/*.po",
    "gnome-extension/po/*.pot",
]
